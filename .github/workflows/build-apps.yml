name: Build apps

on:
  push:
    branches: [master]
    tags: ["v*", "!v*-nightly.*"]
  workflow_dispatch:
    inputs:
      ios-store:
        description: Rebuild a tagged release store IPA (select its vX.Y.Z or vX.Y.Z-rc.N ref)
        type: boolean
        default: false
      mac-store:
        description: Rebuild a tagged release Mac store package (no Apple upload)
        type: boolean
        default: false
      ios-delivery:
        description: Tagged release retry action (master/nightly store jobs are forbidden)
        type: choice
        options: [none, check, upload]
        default: none

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      build-number: ${{ steps.version.outputs.buildNumber }}
      configuration: ${{ steps.version.outputs.configuration }}
      app-version: ${{ steps.version.outputs.appVersion }}
      record-artifact: ${{ steps.version.outputs.buildRecordArtifact }}
      skip: ${{ steps.version.outputs.skip }}
      mac-store-build: ${{ steps.version.outputs.macStoreBuild }}
      store-build: ${{ steps.version.outputs.storeBuild }}
      store-delivery: ${{ steps.version.outputs.storeDelivery }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Check out version history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
      - name: Test release tooling
        run: |
          node --strip-types --test .github/scripts/*.test.ts
          python3 -B .github/scripts/mac-store.test.py
          python3 -B .github/scripts/ios-store.test.py
          python3 -B .github/scripts/ios-upload.test.py
      - name: Resolve version and publication channel
        id: version
        env:
          FLOAT_VIEW_BUILD_RECORD: ${{ runner.temp }}/build-record.json
          FLOAT_VIEW_BUILD_MAC_STORE: ${{ inputs.mac-store }}
          FLOAT_VIEW_BUILD_IOS_STORE: ${{ inputs.ios-store }}
          FLOAT_VIEW_IOS_DELIVERY: ${{ inputs.ios-delivery }}
        run: node --strip-types .github/scripts/prepare.ts

      - name: Retain CI build identity
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ${{ steps.version.outputs.buildRecordArtifact }}
          path: ${{ runner.temp }}/build-record.json
          if-no-files-found: error
          retention-days: 90

  ipa:
    needs: prepare
    if: needs.prepare.outputs.skip == 'false'
    runs-on: macos-15
    timeout-minutes: 45
    env:
      FLOAT_VIEW_VERSION: ${{ needs.prepare.outputs.version }}
      FLOAT_VIEW_BUILD_NUMBER: ${{ needs.prepare.outputs.build-number }}
      FLOAT_VIEW_BUILD_CONFIGURATION: ${{ needs.prepare.outputs.configuration }}
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install build tools
        id: tools
        run: |
          brew install just ripgrep
          toolchain="$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)"
          rustup toolchain install "$toolchain" --profile minimal
          rustup target add aarch64-apple-ios
          xcodebuild -version
          echo "xcode=$(xcodebuild -version | shasum -a 256 | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"

      - name: Cache Cargo downloads and iOS compilation
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            /tmp/float-view-ios-ipa/Build/Intermediates.noindex/**/DerivedSources/cargo
          key: ios-rust-${{ runner.os }}-${{ runner.arch }}-${{ steps.tools.outputs.xcode }}-${{ hashFiles('rust-toolchain.toml', 'backends/core/Cargo.lock') }}-${{ hashFiles('backends/core/**/*.rs', 'backends/core/**/Cargo.toml', 'backends/core/*.sh', 'backends/sql/**') }}
          restore-keys: |
            ios-rust-${{ runner.os }}-${{ runner.arch }}-${{ steps.tools.outputs.xcode }}-${{ hashFiles('rust-toolchain.toml', 'backends/core/Cargo.lock') }}-

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      # The Xcode build phase invokes Cargo with --locked --offline.
      - name: Fetch locked Rust dependencies
        working-directory: backends/core
        run: cargo fetch --locked --target aarch64-apple-ios

      - name: Build AltStore IPA
        run: just ipa

      - name: Upload IPA
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: FloatView-ipa-${{ env.FLOAT_VIEW_VERSION }}
          path: FloatView-*.ipa
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  ios-store:
    needs: prepare
    if: needs.prepare.outputs.store-build == 'true'
    runs-on: macos-26
    timeout-minutes: 45
    environment: apple-store-signing
    outputs:
      artifact-name: ${{ steps.artifact-name.outputs.name }}
    permissions:
      contents: read
      actions: read
    env:
      FLOAT_VIEW_VERSION: v${{ needs.prepare.outputs.app-version }}
      FLOAT_VIEW_BUILD_NUMBER: ${{ needs.prepare.outputs.build-number }}
    steps:
      - name: Check out exact source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check signing environment readiness
        env:
          SIGNING_READY: ${{ vars.IOS_STORE_SIGNING_READY }}
        run: test "$SIGNING_READY" = true
      - name: Download shared build record
        env:
          GH_TOKEN: ${{ github.token }}
          RECORD_ARTIFACT: ${{ needs.prepare.outputs.record-artifact }}
        run: gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$RECORD_ARTIFACT" --dir "$RUNNER_TEMP/ci-record"
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install build tools
        run: |
          brew install just ripgrep
          toolchain="$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)"
          rustup toolchain install "$toolchain" --profile minimal
          rustup target add aarch64-apple-ios
          xcodebuild -version
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Fetch locked Rust dependencies
        working-directory: backends/core
        run: cargo fetch --locked --target aarch64-apple-ios
      - name: Build and verify App Store IPA without uploading
        env:
          FLOAT_VIEW_BUILD_RECORD: ${{ runner.temp }}/ci-record/build-record.json
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          APPLE_SIGNING_CERTIFICATE_KIND: Apple Distribution
          APPLE_CODE_SIGN_P12_BASE64: ${{ secrets.APPLE_DISTRIBUTION_P12_BASE64 }}
          APPLE_CODE_SIGN_P12_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_P12_PASSWORD }}
          IOS_APP_PROFILE_BASE64: ${{ secrets.IOS_APP_PROFILE_BASE64 }}
          IOS_EXTENSION_PROFILE_BASE64: ${{ secrets.IOS_EXTENSION_PROFILE_BASE64 }}
        run: |
          bash backends/apple/with-apple-signing-identity.sh \
            python3 backends/apple/ios-store.py ci-build "$RUNNER_TEMP/ios-store"
      - name: Name verified store artifact
        id: artifact-name
        run: echo "name=FloatView-ios-store-$FLOAT_VIEW_BUILD_NUMBER-attempt-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
      - name: Retain verified IPA and exact source/build record
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ${{ steps.artifact-name.outputs.name }}
          path: |
            ${{ runner.temp }}/ios-store/export/*.ipa
            ${{ runner.temp }}/ios-store/export/export.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  mac-store:
    needs: prepare
    if: needs.prepare.outputs.mac-store-build == 'true' && vars.MACOS_STORE_SIGNING_ENABLED == 'true'
    runs-on: macos-26
    timeout-minutes: 45
    environment: apple-store-signing
    permissions:
      contents: read
      actions: read
    env:
      FLOAT_VIEW_VERSION: ${{ needs.prepare.outputs.version }}
      FLOAT_VIEW_BUILD_NUMBER: ${{ needs.prepare.outputs.build-number }}
    steps:
      - name: Check out exact source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check protected signing readiness
        env:
          SIGNING_READY: ${{ vars.MACOS_STORE_SIGNING_READY }}
        run: test "$SIGNING_READY" = true
      - name: Download shared build record
        env:
          GH_TOKEN: ${{ github.token }}
          RECORD_ARTIFACT: ${{ needs.prepare.outputs.record-artifact }}
        run: gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$RECORD_ARTIFACT" --dir "$RUNNER_TEMP/ci-record"
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install build tools
        run: |
          brew install just ripgrep
          toolchain="$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)"
          rustup toolchain install "$toolchain" --profile minimal
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          xcodebuild -version
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Fetch locked Rust dependencies
        working-directory: backends/core
        run: |
          cargo fetch --locked --target aarch64-apple-darwin
          cargo fetch --locked --target x86_64-apple-darwin
      - name: Build and verify Mac App Store package without uploading
        env:
          FLOAT_VIEW_BUILD_RECORD: ${{ runner.temp }}/ci-record/build-record.json
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          APPLE_SIGNING_CERTIFICATE_KIND: Apple Distribution
          APPLE_CODE_SIGN_P12_BASE64: ${{ secrets.APPLE_DISTRIBUTION_P12_BASE64 }}
          APPLE_CODE_SIGN_P12_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_P12_PASSWORD }}
          MAC_INSTALLER_P12_BASE64: ${{ secrets.MAC_INSTALLER_P12_BASE64 }}
          MAC_INSTALLER_P12_PASSWORD: ${{ secrets.MAC_INSTALLER_P12_PASSWORD }}
          MAC_STORE_PROFILE_BASE64: ${{ secrets.MAC_STORE_PROFILE_BASE64 }}
        run: |
          bash backends/apple/with-apple-signing-identity.sh \
            python3 -B backends/apple/mac-store.py ci-build "$RUNNER_TEMP/mac-store"
      - name: Retain verified installer and exact source/build record
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: FloatView-mac-store-${{ env.FLOAT_VIEW_BUILD_NUMBER }}-attempt-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/mac-store/*.pkg
            ${{ runner.temp }}/mac-store/package.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  ios-upload:
    needs: [prepare, ios-store]
    if: needs.prepare.outputs.store-build == 'true' && needs.prepare.outputs.store-delivery != 'none' && needs.ios-store.result == 'success'
    runs-on: macos-26
    timeout-minutes: 45
    environment: ios-store-upload
    permissions:
      contents: read
      actions: read
    env:
      FLOAT_VIEW_BUILD_NUMBER: ${{ needs.prepare.outputs.build-number }}
    steps:
      - name: Check out approved source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Download exact signed artifact and previous receipts
        env:
          GH_TOKEN: ${{ github.token }}
          STORE_ARTIFACT: ${{ needs.ios-store.outputs.artifact-name }}
          RECEIPT_PREFIX: ios-store-upload-receipt-${{ env.FLOAT_VIEW_BUILD_NUMBER }}-attempt-
        run: |
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$STORE_ARTIFACT" --dir "$RUNNER_TEMP/ios-export"
          mkdir -p "$RUNNER_TEMP/ios-upload-prior"
          has_receipts="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" --jq '.artifacts | any(.name | startswith(env.RECEIPT_PREFIX))')"
          if [[ "$has_receipts" == true ]]; then
            gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --pattern "$RECEIPT_PREFIX*" --dir "$RUNNER_TEMP/ios-upload-prior"
          fi
      - name: Verify signed release and check or upload to Apple
        env:
          IOS_STORE_UPLOAD_READY: ${{ vars.IOS_STORE_UPLOAD_READY }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          ASC_API_KEY_ID: ${{ vars.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ vars.ASC_API_ISSUER_ID }}
          ASC_APP_ID: ${{ vars.ASC_APP_ID }}
          ASC_API_PRIVATE_KEY_BASE64: ${{ secrets.ASC_API_PRIVATE_KEY_BASE64 }}
          DELIVERY_ACTION: ${{ needs.prepare.outputs.store-delivery }}
        run: |
          args=()
          case "$DELIVERY_ACTION" in
            check) args+=(--check-only) ;;
            upload) ;;
            *) echo "Invalid delivery action" >&2; exit 1 ;;
          esac
          python3 backends/apple/ios-upload.py "$RUNNER_TEMP/ios-export" "$RUNNER_TEMP/ios-upload-receipt" --prior-receipts "$RUNNER_TEMP/ios-upload-prior" "${args[@]}"
      - name: Retain upload attempt and processing receipt
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ios-store-upload-receipt-${{ env.FLOAT_VIEW_BUILD_NUMBER }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ios-upload-receipt/*.json
          if-no-files-found: warn
          retention-days: 90

  apk:
    needs: prepare
    if: needs.prepare.outputs.skip == 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      FLOAT_VIEW_VERSION: ${{ needs.prepare.outputs.version }}
      FLOAT_VIEW_BUILD_NUMBER: ${{ needs.prepare.outputs.build-number }}
      FLOAT_VIEW_BUILD_CONFIGURATION: ${{ needs.prepare.outputs.configuration }}
      # Transfer reusable Cargo artifacts, not large per-checkout incremental state.
      CARGO_INCREMENTAL: "0"
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_17_X64/bin" >> "$GITHUB_PATH"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            'platforms;android-36' 'build-tools;35.0.0' 'ndk;28.2.13676358'
          # Override any runner-provided NDK so Cargo uses the pinned revision.
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
          toolchain="$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)"
          rustup toolchain install "$toolchain" --profile minimal
          rustup target add aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android

      - name: Cache Cargo downloads and Android compilation
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            backends/core/target
            !backends/core/target/**/incremental/**
          key: android-rust-v2-${{ runner.os }}-${{ runner.arch }}-ndk28.2.13676358-${{ hashFiles('rust-toolchain.toml', 'backends/core/Cargo.lock') }}-${{ hashFiles('backends/core/**/*.rs', 'backends/core/**/Cargo.toml', 'backends/core/*.sh', 'backends/sql/**') }}
          restore-keys: |
            android-rust-v2-${{ runner.os }}-${{ runner.arch }}-ndk28.2.13676358-${{ hashFiles('rust-toolchain.toml', 'backends/core/Cargo.lock') }}-

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      # The Gradle Rust build helper invokes Cargo with --locked --offline.
      - name: Fetch locked Rust dependencies
        working-directory: backends/core
        run: |
          cargo fetch --locked \
            --target aarch64-linux-android --target armv7-linux-androideabi \
            --target i686-linux-android --target x86_64-linux-android

      # Cache the wrapper, dependencies, compiled build scripts and task outputs.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2

      - name: Build APK
        working-directory: backends/android
        run: ./gradlew --no-daemon --build-cache "assemble$FLOAT_VIEW_BUILD_CONFIGURATION"

      - name: Sign and verify versioned APK
        env:
          ANDROID_SIGNING_KEYSTORE_BASE64: ${{ secrets.ANDROID_SIGNING_KEYSTORE_BASE64 }}
          ANDROID_SIGNING_PASSWORD: ${{ secrets.ANDROID_SIGNING_PASSWORD }}
        run: |
          : "${ANDROID_SIGNING_KEYSTORE_BASE64:?Missing Android signing keystore secret}"
          : "${ANDROID_SIGNING_PASSWORD:?Missing Android signing password secret}"
          umask 077
          keystore="$RUNNER_TEMP/float-view-signing.p12"
          trap 'rm -f "$keystore"' EXIT
          printf '%s' "$ANDROID_SIGNING_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          version="$FLOAT_VIEW_VERSION"
          apksigner="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          if [[ "$FLOAT_VIEW_BUILD_CONFIGURATION" == Release ]]; then
            source_apk=backends/android/app/build/outputs/apk/release/app-release-unsigned.apk
          else
            source_apk=backends/android/app/build/outputs/apk/debug/app-debug.apk
          fi
          "$apksigner" sign --ks "$keystore" --ks-key-alias float-view-ci \
            --ks-pass env:ANDROID_SIGNING_PASSWORD --key-pass env:ANDROID_SIGNING_PASSWORD \
            --out "FloatView-$version.apk" \
            "$source_apk"
          "$apksigner" verify --verbose --print-certs "FloatView-$version.apk"

      - name: Upload APK
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: FloatView-apk-${{ env.FLOAT_VIEW_VERSION }}
          path: FloatView-*.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  macos:
    needs: prepare
    if: needs.prepare.outputs.skip == 'false'
    runs-on: macos-15
    timeout-minutes: 65
    env:
      FLOAT_VIEW_VERSION: ${{ needs.prepare.outputs.version }}
      FLOAT_VIEW_BUILD_NUMBER: ${{ needs.prepare.outputs.build-number }}
      FLOAT_VIEW_BUILD_CONFIGURATION: ${{ needs.prepare.outputs.configuration }}
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install build tools
        id: tools
        run: |
          brew install ripgrep
          toolchain="$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)"
          rustup toolchain install "$toolchain" --profile minimal
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          xcodebuild -version
          echo "xcode=$(xcodebuild -version | shasum -a 256 | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"

      - name: Cache Cargo downloads and macOS compilation
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            backends/core/target/apple/macos/cargo
          key: macos-rust-${{ runner.os }}-${{ runner.arch }}-${{ steps.tools.outputs.xcode }}-${{ hashFiles('rust-toolchain.toml', 'backends/core/Cargo.lock') }}-${{ hashFiles('backends/core/**/*.rs', 'backends/core/**/Cargo.toml', 'backends/core/*.sh', 'backends/sql/**') }}
          restore-keys: |
            macos-rust-${{ runner.os }}-${{ runner.arch }}-${{ steps.tools.outputs.xcode }}-${{ hashFiles('rust-toolchain.toml', 'backends/core/Cargo.lock') }}-

      - name: Build frontend
        run: |
          (cd frontend && npm ci && npm run build)
          cp frontend/build/index.html backends/apple/macos/Resources/index.html

      - name: Fetch locked Rust dependencies
        working-directory: backends/core
        run: cargo fetch --locked --target aarch64-apple-darwin --target x86_64-apple-darwin

      # Temporary workaround: force TCP instead of unreliable HTTP/3 ticket lookups.
      # https://github.com/actions/runner-images/issues/14924
      # Only change networking on the disposable GitHub-hosted runner.
      - name: Work around Apple ticket delivery networking
        run: |
          echo "block return out quick proto udp from any to any port 443" | sudo pfctl -f -
          sudo pfctl -E

      - name: Build, sign and notarize universal macOS app
        env:
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          APPLE_CODE_SIGN_P12_BASE64: ${{ secrets.MACOS_CODE_SIGN_P12_BASE64 }}
          APPLE_CODE_SIGN_P12_PASSWORD: ${{ secrets.MACOS_CODE_SIGN_P12_PASSWORD }}
          APPLE_NOTARY_APPLE_ID: ${{ secrets.APPLE_NOTARY_APPLE_ID }}
          APPLE_NOTARY_PASSWORD: ${{ secrets.APPLE_NOTARY_PASSWORD }}
        run: |
          : "${APPLE_TEAM_ID:?Missing Apple Team ID variable}"
          : "${APPLE_NOTARY_APPLE_ID:?Missing notarization Apple Account secret}"
          : "${APPLE_NOTARY_PASSWORD:?Missing notarization app-specific password secret}"
          bash backends/apple/with-apple-signing-identity.sh bash backends/apple/build-macos-release.sh

      - name: Upload macOS app
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: FloatView-macos-${{ env.FLOAT_VIEW_VERSION }}
          path: FloatView-*-macos-universal.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  release:
    needs: [prepare, ipa, apk, macos]
    # Serialize only publication. A store approval/upload must not hold nightlies.
    concurrency:
      group: app-distribution
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    env:
      FLOAT_VIEW_VERSION: ${{ needs.prepare.outputs.version }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Check out version history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
      - name: Download app artifacts
        run: |
          gh run download "$GITHUB_RUN_ID" --name "FloatView-ipa-$FLOAT_VIEW_VERSION" --dir .
          gh run download "$GITHUB_RUN_ID" --name "FloatView-apk-$FLOAT_VIEW_VERSION" --dir .
          gh run download "$GITHUB_RUN_ID" --name "FloatView-macos-$FLOAT_VIEW_VERSION" --dir .

      - name: Publish stable release or rolling Nightly
        run: node --strip-types .github/scripts/publish.ts
