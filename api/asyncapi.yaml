asyncapi: 3.0.0
info:
  title: Float View local backend API
  version: 1.0.0
  description: |
    The platform-neutral contract between the shared web UI and a native Float
    View backend. This initial contract implements version negotiation and state
    snapshots and coarse state-change notifications.
defaultContentType: application/json
servers:
  local:
    host: 127.0.0.1:{port}
    pathname: /api/v1/ws
    protocol: ws
    description: Ephemeral loopback server owned by the native application.
    variables:
      port:
        description: Ephemeral port selected when the backend starts.
channels:
  api:
    address: /api/v1/ws
    description: JSON-RPC 2.0 requests, responses, and server notifications.
    messages:
      helloRequest:
        $ref: "#/components/messages/helloRequest"
      helloResponse:
        $ref: "#/components/messages/helloResponse"
      getSnapshotRequest:
        $ref: "#/components/messages/getSnapshotRequest"
      getSnapshotResponse:
        $ref: "#/components/messages/getSnapshotResponse"
      snapshotChanged:
        $ref: "#/components/messages/snapshotChanged"
      errorResponse:
        $ref: "#/components/messages/errorResponse"
operations:
  receiveHello:
    action: receive
    channel:
      $ref: "#/channels/api"
    summary: Negotiate a compatible API version and return the initial snapshot.
    messages:
      - $ref: "#/channels/api/messages/helloRequest"
  sendHelloResult:
    action: send
    channel:
      $ref: "#/channels/api"
    messages:
      - $ref: "#/channels/api/messages/helloResponse"
      - $ref: "#/channels/api/messages/errorResponse"
  receiveGetSnapshot:
    action: receive
    channel:
      $ref: "#/channels/api"
    summary: Request the backend's current authoritative state.
    messages:
      - $ref: "#/channels/api/messages/getSnapshotRequest"
  sendGetSnapshotResult:
    action: send
    channel:
      $ref: "#/channels/api"
    messages:
      - $ref: "#/channels/api/messages/getSnapshotResponse"
      - $ref: "#/channels/api/messages/errorResponse"
  sendSnapshotChanged:
    action: send
    channel:
      $ref: "#/channels/api"
    summary: Tell clients to refresh the authoritative snapshot and collections.
    messages:
      - $ref: "#/channels/api/messages/snapshotChanged"
components:
  messages:
    helloRequest:
      name: system.hello request
      payload:
        $ref: "./schemas/system.schema.json#/$defs/HelloRequest"
    helloResponse:
      name: system.hello response
      payload:
        $ref: "./schemas/system.schema.json#/$defs/HelloResponse"
    getSnapshotRequest:
      name: system.getSnapshot request
      payload:
        $ref: "./schemas/system.schema.json#/$defs/GetSnapshotRequest"
    getSnapshotResponse:
      name: system.getSnapshot response
      payload:
        $ref: "./schemas/system.schema.json#/$defs/GetSnapshotResponse"
    errorResponse:
      name: JSON-RPC error response
      payload:
        $ref: "./schemas/common.schema.json#/$defs/RpcErrorResponse"
    snapshotChanged:
      name: system.snapshotChanged notification
      payload:
        type: object
        additionalProperties: false
        required: [jsonrpc, method, params]
        properties:
          jsonrpc:
            const: "2.0"
          method:
            const: system.snapshotChanged
          params:
            type: object
            additionalProperties: false
