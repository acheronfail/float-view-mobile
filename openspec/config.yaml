schema: spec-driven

context: |
  Float View is one SvelteKit frontend and native backends for iOS, macOS, and
  Android. frontend/src/lib/backend/contract.ts is the small hand-written
  contract source of truth. Backends implement it without generated models;
  conformance/ owns the canonical black-box suite and VESC simulation.
  Native services own Bluetooth, background execution, durable SQLite logging,
  permissions, lifecycle, exports, and the authenticated loopback server.
  The project is still in test-stage: incompatible databases are deleted and
  recreated from the current schema rather than migrated.
  Prefer deletion, standard libraries, and small maintained dependencies.
  Keep the development loop centered on the root justfile. `just verify` is
  the complete software gate.

rules:
  proposal:
    - Keep proposals concise and include explicit non-goals.
    - Identify code, scripts, dependencies, or compatibility machinery that can be removed.
    - Call out any cross-platform API or persistence behavior change.
  specs:
    - Describe platform-neutral observable behavior, not framework-specific implementation.
    - Include failure, reconnect, lifecycle, ordering, and bounded-resource scenarios where relevant.
  design:
    - Preserve the ownership and dependency boundaries described in AGENTS.md.
    - Justify every new dependency by the code and complexity it replaces.
    - Do not introduce database migrations while stored data remains disposable test data.
  tasks:
    - Keep tasks independently verifiable and avoid wrapper scripts for simple commands.
    - End with focused checks followed by `just verify`.
