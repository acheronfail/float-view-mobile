schema: spec-driven

context: |
  Float View is one SvelteKit frontend and native backends for iOS, macOS, and
  Android. frontend/src/lib/backend/contract.ts is the small hand-written
  contract source of truth. Backends implement it without generated models;
  conformance/ owns the canonical black-box suite and VESC simulation.
  Native services own Bluetooth, background execution, permissions, lifecycle,
  scoped file presentation and UI. The process-owned Rust service owns product
  storage, application policy, protocol and durable session work; loopback-server owns authenticated HTTP/WebSocket routes,
  public projection and bounded history reads through the existing C/JNI bindings.
  Owned-storage baseline 100 applies before external beta, independent of version
  tags or store/nightly channels. Preserve baseline and subsequent supported data.
  Only recognised pre-baseline development markers/layouts authorize bounded,
  restartable resets of validated owned files. Unknown/newer/malformed markers,
  nonempty roots without markers, corruption and I/O failures preserve data and
  fail actionably. Increment later incompatible storage markers and provide an
  explicitly tested upgrade; add no general migration framework without a real
  published transition. Archive format numbering remains independent. Keep frozen
  baseline fixtures; do not retain pre-baseline readers, aliases or fallbacks.
  Supported VESC/Refloat firmware wire families are not legacy application data.
  Prefer deletion, standard libraries, and small maintained dependencies.
  Follow the impact-based verification policy in AGENTS.md and CONTRIBUTING.md. Run
  focused checks for changed behavior and affected consumers; frontend-only edits
  need frontend checks, and documentation-only edits need documentation validation.
  `just verify` is optional comprehensive coverage, not a per-change completion gate.
  Physical checkpoints cover only affected OS/device/firmware behavior that software
  cannot establish, on relevant platforms and scenarios. Report actual results and
  missing required coverage; ordinary software-only edits need no hardware-skip report.
  Historical Rust migration/cutover gates apply only to their original changes.
  Run every OpenSpec CLI command with `OPENSPEC_TELEMETRY=0`; OpenSpec work in
  this repository must not make telemetry requests.
  AGENTS.md owns completion policy; docs/development.md#openspec owns validation commands.

rules:
  proposal:
    - Keep proposals concise and include explicit non-goals.
    - Identify code, scripts, dependencies, or compatibility machinery that can be removed.
    - Call out any cross-platform API or persistence behavior change.
  specs:
    - Describe platform-neutral observable behavior, not framework-specific implementation.
    - Include failure, reconnect, lifecycle, ordering, and bounded-resource scenarios where relevant.
  design:
    - Preserve the ownership and dependency boundaries described in AGENTS.md.
    - Justify every new dependency by the code and complexity it replaces.
    - Preserve baseline and supported data; introduce upgrades only for actual incompatible published transitions, never to recover disposable pre-baseline formats.
  tasks:
    - Keep tasks independently verifiable and avoid wrapper scripts for simple commands.
    - End with checks for changed code and affected consumers; require broader or physical coverage only when justified by impact.
