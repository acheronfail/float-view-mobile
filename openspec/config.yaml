schema: spec-driven

context: |
  Float View is one SvelteKit frontend and native backends for iOS, macOS, and
  Android. frontend/src/lib/backend/contract.ts is the small hand-written
  contract source of truth. Backends implement it without generated models;
  conformance/ owns the canonical black-box suite and VESC simulation.
  Native services own Bluetooth, background execution, permissions, lifecycle,
  exports and the session catalog. The selected Rust runtime owns protocol and
  durable session work; loopback-server owns authenticated HTTP/WebSocket routes,
  public projection and bounded history reads through the existing C/JNI bindings.
  The application has no users and has not cut its first release. Until that
  release, data and archives are disposable development data: delete superseded
  migration, legacy-identity, old-format and fallback code rather than preserve
  earlier development versions. Reset incompatible owned storage using explicit
  schema/format markers, never on ordinary corruption or operational failure.
  Supported VESC/Refloat firmware wire families are not legacy application data.
  Prefer deletion, standard libraries, and small maintained dependencies.
  Keep the development loop centered on the root justfile. `just verify` is
  the complete software gate.
  Run every OpenSpec CLI command with `OPENSPEC_TELEMETRY=0`; OpenSpec work in
  this repository must not make telemetry requests.
  Use three git phases for each OpenSpec change. First, commit the completed
  proposal, design, delta specs, and tasks before implementation. Next, make
  one or more coherent implementation commits that include the corresponding
  task updates and keep each verified slice buildable. After `just verify`
  passes, sync the delta specs and archive the change together in one final
  commit. Split sync from archive only when the canonical spec update requires
  independent review. Do not create ceremonial commits for OpenSpec commands
  that produce no meaningful repository state.

rules:
  proposal:
    - Keep proposals concise and include explicit non-goals.
    - Identify code, scripts, dependencies, or compatibility machinery that can be removed.
    - Call out any cross-platform API or persistence behavior change.
  specs:
    - Describe platform-neutral observable behavior, not framework-specific implementation.
    - Include failure, reconnect, lifecycle, ordering, and bounded-resource scenarios where relevant.
  design:
    - Preserve the ownership and dependency boundaries described in AGENTS.md.
    - Justify every new dependency by the code and complexity it replaces.
    - Do not introduce database migrations while stored data remains disposable test data.
  tasks:
    - Keep tasks independently verifiable and avoid wrapper scripts for simple commands.
    - End with focused checks followed by `just verify`.
