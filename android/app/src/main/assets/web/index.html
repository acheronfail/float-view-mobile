<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Float View Mobile</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }
        .container {
            max-width: 400px;
            background: rgba(255, 255, 255, 0.1);
            padding: 30px;
            border-radius: 15px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }
        h1 {
            margin: 0 0 20px 0;
            font-size: 2.5em;
            font-weight: 300;
        }
        p {
            margin: 0 0 15px 0;
            font-size: 1.2em;
            opacity: 0.9;
        }
        .status {
            margin-top: 20px;
            padding: 10px 20px;
            background: rgba(76, 175, 80, 0.3);
            border-radius: 25px;
            font-weight: 500;
        }
        .api-test {
            margin-top: 20px;
            padding: 10px 20px;
            background: rgba(33, 150, 243, 0.3);
            border-radius: 25px;
            cursor: pointer;
            transition: background 0.3s;
        }
        .api-test:hover {
            background: rgba(33, 150, 243, 0.5);
        }
        .result {
            margin-top: 15px;
            padding: 10px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 8px;
            font-family: 'Courier New', monospace;
            font-size: 0.9em;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Hello</h1>
        <p>Welcome to your local server!</p>
        <p>This server runs entirely within the app with no external dependencies.</p>

        <div class="status">
            ✓ Server is running locally on port {{PORT}}
        </div>

        <div class="api-test" onclick="testApi()">
            🔍 Test API Endpoint
        </div>

        <div id="result" class="result" style="display: none;"></div>
    </div>

    <script>
        async function testApi() {
            try {
                const response = await fetch('/api/status');
                const data = await response.json();

                document.getElementById('result').innerHTML =
                    'API Response: ' + JSON.stringify(data, null, 2);
                document.getElementById('result').style.display = 'block';
            } catch (error) {
                document.getElementById('result').innerHTML =
                    'Error: ' + error.message;
                document.getElementById('result').style.display = 'block';
            }
        }
    </script>
</body>
</html>
