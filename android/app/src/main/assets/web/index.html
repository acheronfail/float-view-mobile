<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Float View Mobile</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }
        .container {
            max-width: 400px;
            background: rgba(255, 255, 255, 0.1);
            padding: 30px;
            border-radius: 15px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }
        h1 {
            margin: 0 0 20px 0;
            font-size: 2.5em;
            font-weight: 300;
        }
        p {
            margin: 0 0 15px 0;
            font-size: 1.2em;
            opacity: 0.9;
        }
        .status {
            margin-top: 20px;
            padding: 10px 20px;
            background: rgba(76, 175, 80, 0.3);
            border-radius: 25px;
            font-weight: 500;
        }
        .api-test {
            margin-top: 20px;
            padding: 10px 20px;
            background: rgba(33, 150, 243, 0.3);
            border-radius: 25px;
            cursor: pointer;
            transition: background 0.3s;
        }
        .api-test:hover {
            background: rgba(33, 150, 243, 0.5);
        }
        .websocket-section {
            margin-top: 20px;
            padding: 20px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 15px;
        }
        .websocket-status {
            padding: 10px 15px;
            border-radius: 20px;
            font-weight: 500;
            margin-bottom: 15px;
        }
        .websocket-connected {
            background: rgba(76, 175, 80, 0.3);
        }
        .websocket-disconnected {
            background: rgba(244, 67, 54, 0.3);
        }
        .message-input {
            width: 100%;
            padding: 10px;
            border: none;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            font-size: 16px;
            margin-bottom: 10px;
        }
        .message-input::placeholder {
            color: rgba(255, 255, 255, 0.7);
        }
        .send-button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: rgba(76, 175, 80, 0.5);
            color: white;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.3s;
        }
        .send-button:hover {
            background: rgba(76, 175, 80, 0.7);
        }
        .send-button:disabled {
            background: rgba(128, 128, 128, 0.3);
            cursor: not-allowed;
        }
        .toggle-button {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            background: rgba(33, 150, 243, 0.5);
            color: white;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.3s;
            margin-bottom: 15px;
        }
        .toggle-button:hover {
            background: rgba(33, 150, 243, 0.7);
        }
        .messages {
            max-height: 200px;
            overflow-y: auto;
            margin-top: 15px;
            padding: 10px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 8px;
        }
        .message {
            padding: 8px;
            margin: 5px 0;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 6px;
            font-size: 14px;
            word-break: break-word;
        }
        .message.sent {
            background: rgba(33, 150, 243, 0.3);
        }
        .message.received {
            background: rgba(76, 175, 80, 0.3);
        }
        .message.error {
            background: rgba(244, 67, 54, 0.3);
        }
        .message.system {
            background: rgba(158, 158, 158, 0.3);
        }
        .result {
            margin-top: 15px;
            padding: 10px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 8px;
            font-family: 'Courier New', monospace;
            font-size: 0.9em;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Hello</h1>
        <p>Welcome to your local server!</p>
        <p>This server runs entirely within the app with no external dependencies.</p>

        <div class="status">
            ✓ Server is running locally on port {{PORT}}
        </div>

        <div class="api-test" onclick="testApi()">
            🔍 Test API Endpoint
        </div>

        <div id="result" class="result" style="display: none;"></div>

        <div class="websocket-section">
            <h3>WebSocket Connection</h3>
            <div id="wsStatus" class="websocket-status websocket-disconnected">
                🔴 Disconnected
            </div>

            <button onclick="toggleWebSocket()" id="wsToggle" class="toggle-button">Connect</button>

            <!-- Always show messages for debugging -->
            <div class="messages" id="messages"></div>

            <div id="wsControls" style="display: none;">
                <input type="text" id="messageInput" class="message-input"
                       placeholder="Type a message..." onkeypress="handleKeyPress(event)">
                <button onclick="sendMessage()" class="send-button" id="sendBtn">Send Message</button>
            </div>
        </div>
    </div>

    <script>
        let websocket = null;
        let isConnected = false;

        async function testApi() {
            try {
                const response = await fetch('/api/status');
                const data = await response.json();

                document.getElementById('result').innerHTML =
                    'API Response: ' + JSON.stringify(data, null, 2);
                document.getElementById('result').style.display = 'block';
            } catch (error) {
                document.getElementById('result').innerHTML =
                    'Error: ' + error.message;
                document.getElementById('result').style.display = 'block';
            }
        }

        function toggleWebSocket() {
            console.log('toggleWebSocket called, isConnected:', isConnected);
            console.log('websocket exists:', !!websocket);
            console.log('websocket readyState:', websocket ? websocket.readyState : 'null');

            if (isConnected) {
                console.log('Calling disconnectWebSocket');
                disconnectWebSocket();
            } else {
                console.log('Calling connectWebSocket');
                connectWebSocket();
            }
        }

        function connectWebSocket() {
            try {
                const wsUrl = `ws://${window.location.host}/ws`;
                console.log('Attempting to connect to WebSocket:', wsUrl);
                console.log('Current location:', window.location);
                addMessage('System', 'Attempting to connect to: ' + wsUrl, 'system');

                websocket = new WebSocket(wsUrl);

                websocket.onopen = function(event) {
                    console.log('WebSocket connected successfully');
                    isConnected = true;
                    updateConnectionStatus(true);
                    addMessage('System', 'Connected to WebSocket server', 'system');
                };

                websocket.onmessage = function(event) {
                    console.log('WebSocket message received:', event.data);
                    try {
                        // Parse JSON message
                        const data = JSON.parse(event.data);
                        handleWebSocketMessage(data);
                    } catch (error) {
                        console.error('Error parsing WebSocket message as JSON:', error);
                        addMessage('System', 'Received invalid JSON: ' + event.data, 'error');
                    }
                };

                websocket.onclose = function(event) {
                    console.log('WebSocket onclose event triggered', event);
                    console.log('Close code:', event.code, 'Close reason:', event.reason);
                    console.log('Current isConnected:', isConnected);

                    // Only update status if not already updated by manual disconnect
                    if (isConnected) {
                        isConnected = false;
                        updateConnectionStatus(false);
                        addMessage('System', `WebSocket closed unexpectedly (Code: ${event.code}, Reason: ${event.reason || 'No reason'})`, 'system');
                    } else {
                        console.log('WebSocket already marked as disconnected, not updating status');
                    }
                };

                websocket.onerror = function(error) {
                    console.error('WebSocket error:', error);
                    console.error('WebSocket readyState:', websocket ? websocket.readyState : 'null');
                    isConnected = false;
                    updateConnectionStatus(false);
                    addMessage('System', 'WebSocket error occurred. Check console for details.', 'error');
                };
            } catch (error) {
                console.error('Error creating WebSocket:', error);
                addMessage('System', 'Failed to create WebSocket: ' + error.message, 'error');
            }
        }

        function disconnectWebSocket() {
            console.log('disconnectWebSocket called, websocket exists:', !!websocket);
            if (websocket) {
                console.log('Closing WebSocket, current readyState:', websocket.readyState);
                addMessage('System', 'Disconnecting WebSocket...', 'system');

                // Close the WebSocket with normal closure code
                websocket.close(1000, 'User disconnected');
                websocket = null;

                // Immediately update status to disconnected
                isConnected = false;
                updateConnectionStatus(false);

                addMessage('System', 'WebSocket disconnected manually', 'system');
            } else {
                console.log('No WebSocket to disconnect');
                // Ensure status is correct even if websocket is null
                isConnected = false;
                updateConnectionStatus(false);
            }
        }

        function updateConnectionStatus(connected) {
            const statusElement = document.getElementById('wsStatus');
            const toggleButton = document.getElementById('wsToggle');
            const controlsElement = document.getElementById('wsControls');

            if (connected) {
                statusElement.textContent = '🟢 Connected';
                statusElement.className = 'websocket-status websocket-connected';
                toggleButton.textContent = 'Disconnect';
                controlsElement.style.display = 'block';
            } else {
                statusElement.textContent = '🔴 Disconnected';
                statusElement.className = 'websocket-status websocket-disconnected';
                toggleButton.textContent = 'Connect';
                controlsElement.style.display = 'none';
            }
        }

        function handleWebSocketMessage(data) {
            switch (data.type) {
                case 'welcome':
                    addMessage('Server', data.message + ` (Client ID: ${data.clientId})`, 'system');
                    break;
                case 'echo':
                    addMessage('Echo', `Server echoed: ${JSON.stringify(data.original)} at ${new Date(data.timestamp).toLocaleTimeString()}`, 'received');
                    break;
                case 'broadcast':
                    addMessage(`Broadcast from ${data.from}`, JSON.stringify(data.message), 'received');
                    break;
                case 'error':
                    addMessage('Server Error', data.message, 'error');
                    break;
                default:
                    addMessage('Server', JSON.stringify(data), 'received');
            }
        }

        function sendMessage() {
            const messageInput = document.getElementById('messageInput');
            const message = messageInput.value.trim();

            if (message && websocket && isConnected) {
                // Create JSON message
                const messageData = {
                    type: 'message',
                    content: message,
                    timestamp: Date.now()
                };

                try {
                    // Send as JSON string
                    const jsonString = JSON.stringify(messageData);
                    websocket.send(jsonString);
                    addMessage('You', message, 'sent');
                    messageInput.value = '';
                } catch (error) {
                    console.error('Error sending message:', error);
                    addMessage('System', 'Error sending message: ' + error.message, 'error');
                }
            }
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        }

        function addMessage(sender, content, type) {
            const messagesContainer = document.getElementById('messages');
            if (!messagesContainer) {
                console.error('Messages container not found');
                return;
            }

            const messageElement = document.createElement('div');
            messageElement.className = `message ${type}`;

            const timestamp = new Date().toLocaleTimeString();
            messageElement.innerHTML = `<strong>${sender}</strong> (${timestamp})<br>${content}`;

            messagesContainer.appendChild(messageElement);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        // Auto-connect on page load (commented out for debugging)
        window.addEventListener('load', function() {
            console.log('Page loaded, WebSocket connection available via Connect button');

            // Check WebSocket support
            if (typeof WebSocket === 'undefined') {
                console.error('WebSocket is not supported');
                addMessage('System', 'ERROR: WebSocket is not supported in this browser', 'error');
            } else {
                console.log('WebSocket is supported');
                addMessage('System', 'WebSocket is supported - Click Connect to establish connection', 'system');
            }

            // Debug info
            console.log('Current URL:', window.location.href);
            console.log('Host:', window.location.host);
            console.log('Protocol:', window.location.protocol);

            addMessage('System', `Page loaded. Current URL: ${window.location.href}`, 'system');

            // setTimeout(connectWebSocket, 1000); // Give the server a moment to be ready
        });
    </script>
</body>
</html>
