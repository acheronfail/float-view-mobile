[workspace]
resolver = "2"
members = [
  "crates/app-backend",
  "crates/app-coordinator",
  "crates/domain-types",
  "crates/host-android-jni",
  "crates/host-c-abi",
  "crates/host-ports",
  "crates/host-runtime",
  "crates/infra-loopback-server",
  "crates/infra-sqlite-storage",
  "crates/protocol-refloat",
  "crates/protocol-vesc",
  "crates/protocol-vesc-bms",
  "crates/test-core-smoke",
  "crates/test-dependency-smoke",
  "crates/test-software-adapters",
  "crates/test-standalone",
]

[workspace.package]
edition = "2024"
license = "GPL-3.0-or-later"
rust-version = "1.93"
version = "0.1.0"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = "deny"
pedantic = "deny"

[profile.dev]
panic = "unwind"

[profile.release]
panic = "unwind"
