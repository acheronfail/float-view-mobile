[package]
name = "app-backend"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
software-host = ["dep:test-software-adapters"]

[dependencies]
app-coordinator = { path = "../app-coordinator" }
protocol-vesc-bms = { path = "../protocol-vesc-bms" }
domain-types = { path = "../domain-types" }
infra-loopback-server = { path = "../infra-loopback-server" }
host-ports = { path = "../host-ports" }
protocol-refloat = { path = "../protocol-refloat" }
test-software-adapters = { path = "../test-software-adapters", optional = true }
infra-sqlite-storage = { path = "../infra-sqlite-storage" }
protocol-vesc = { path = "../protocol-vesc" }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.142"
tokio = { version = "1.47.1", features = ["macros", "rt-multi-thread"] }

[dev-dependencies]
tempfile = "3.27.0"

[lints]
workspace = true
