language = "C"
include_guard = "FLOAT_VIEW_CORE_H"
include_version = true
documentation = true
usize_is_size_t = true
cpp_compat = true
style = "type"
sort_by = "Name"

header = """
/* Generated by cbindgen 0.29.2. Do not edit by hand. */
"""
after_includes = "typedef struct FloatViewRuntime FloatViewRuntime;"

[parse]
parse_deps = false

[export]
item_types = ["constants", "globals", "enums", "structs", "typedefs", "functions"]
