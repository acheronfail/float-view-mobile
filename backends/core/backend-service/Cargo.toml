[package]
name = "float-view-backend-service"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
float-view-application-runtime = { path = "../application-runtime" }
float-view-product-store = { path = "../product-store" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = { version = "=0.3.53", default-features = false, features = ["std", "formatting"] }
tokio = { version = "=1.53.1", default-features = false, features = ["sync"] }

[[test]]
name = "ble-transport"
path = "../../../conformance/rust/ble-transport.rs"
