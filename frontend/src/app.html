<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#f8fafc" />
    <!-- Paint the canvas before the application stylesheet or JavaScript loads. -->
    <style>
      :root {
        background: #f8fafc;
        color-scheme: light;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme='light']) {
          background: #020617;
          color-scheme: dark;
        }
      }
      :root[data-theme='dark'] {
        background: #020617;
        color-scheme: dark;
      }
      #app-loading {
        position: fixed;
        inset: 0;
        z-index: 1000;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 20px;
        background: #f8fafc;
        color: #0e7490;
        font:
          15px system-ui,
          sans-serif;
      }
      #app-loading[hidden] {
        display: none;
      }
      #app-loading p {
        margin: 0;
        color: #64748b;
      }
      :root[data-theme='dark'] #app-loading {
        background: #020617;
        color: #a2d4d8;
      }
      :root[data-theme='dark'] #app-loading p {
        color: #94a3b8;
      }
    </style>
    <script>
      (() => {
        const key = 'float-view-theme';
        let stored = null;
        let accent = null;
        try {
          stored = localStorage?.getItem(key);
          accent = localStorage?.getItem('float-view-accent');
        } catch {
          // Theme persistence is optional and must not prevent application startup.
        }
        const preference = ['system', 'light', 'dark'].includes(stored) ? stored : 'system';
        const effective =
          preference === 'system'
            ? matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light'
            : preference;
        document.documentElement.dataset.accent = ['purple', 'blue', 'teal', 'amber', 'rose'].includes(accent)
          ? accent
          : 'purple';
        document.documentElement.dataset.theme = effective;
        document.documentElement.style.colorScheme = effective;
        document
          .querySelector('meta[name="theme-color"]')
          ?.setAttribute('content', effective === 'dark' ? '#020617' : '#f8fafc');
      })();
    </script>
    %sveltekit.head%
  </head>
