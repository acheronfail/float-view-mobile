<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#f8fafc" />
    <script>
      (() => {
        const key = 'float-view-theme';
        let stored = null;
        try {
          stored = localStorage?.getItem(key);
        } catch {
          // Theme persistence is optional and must not prevent application startup.
        }
        const preference = ['system', 'light', 'dark'].includes(stored) ? stored : 'system';
        const effective =
          preference === 'system'
            ? matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light'
            : preference;
        document.documentElement.dataset.theme = effective;
        document.documentElement.style.colorScheme = effective;
        document
          .querySelector('meta[name="theme-color"]')
          ?.setAttribute('content', effective === 'dark' ? '#020617' : '#f8fafc');
      })();
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
